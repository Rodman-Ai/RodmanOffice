<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to RodmanVision…</title>
  <link rel="canonical" href="../vision/" />
  <meta http-equiv="refresh" content="0; url=../vision/" />
  <script>
    // RodmanVision moved from /diagrams/ to /vision/. Unregister any
    // service worker that was installed under the old scope so a
    // stale shell doesn't keep serving this page, then redirect.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => Promise.all(regs.map((r) => r.unregister())))
        .catch(() => {})
        .finally(() => { location.replace('../vision/'); });
    } else {
      location.replace('../vision/');
    }
  </script>
  <style>
    body { font: 14px/1.4 -apple-system, system-ui, sans-serif;
           padding: 32px; color: #333; }
    a { color: #1a8e9a; }
  </style>
</head>
<body>
  <p>RodmanVision moved to <a href="../vision/">../vision/</a>.
     Redirecting…</p>
</body>
</html>
